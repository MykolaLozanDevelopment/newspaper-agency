{% extends "base.html" %}

{% block content %}
  <div class="card shadow-sm form-card">
    <div class="card-body">
      <h1 class="mb-4">Add redactor</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'news:redactor-list' %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
