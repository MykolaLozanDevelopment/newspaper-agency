{% extends "base.html" %}

{% block content %}
  <div class="card shadow-sm form-card">
    <div class="card-body">
      <h1 class="mb-3">Delete redactor</h1>
      <p>Are you sure you want to delete "<strong>{{ object.username }}</strong>"?</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'news:redactor-list' %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
