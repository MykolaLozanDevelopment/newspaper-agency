{% extends "base.html" %}

{% block content %}
  <div class="card shadow-sm" style="max-width: 700px;">
    <div class="card-body">
      <h1 class="mb-4">{% if form.instance.pk %}Edit newspaper{% else %}Add newspaper{% endif %}</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'news:newspaper-list' %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
