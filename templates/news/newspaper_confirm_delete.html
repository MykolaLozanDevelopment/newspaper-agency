{% extends "base.html" %}

{% block content %}
  <h1>Delete newspaper</h1>
  <p>Are you sure you want to delete "{{ object.title }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'news:newspaper-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
